name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domovoy
          POSTGRES_PASSWORD: domovoy
          POSTGRES_DB: domovoy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U domovoy -d domovoy"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://domovoy:domovoy@localhost:5432/domovoy
      TEST_DATABASE_URL: postgresql://domovoy:domovoy@localhost:5432/domovoy
    defaults:
      run:
        working-directory: dev/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - run: uv run python scripts/contract_lint.py ../contracts/openapi.yaml
      - run: uv run python scripts/contract_check.py ../contracts/openapi.yaml

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/frontend/package-lock.json
      - run: npm ci
      - run: npm run contract-types
      - run: git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest --run
      - run: npm run build

  style:
    name: Комментарии и докстринги
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_comments.py dev/backend/app dev/backend/tests dev/backend/scripts dev/frontend/src scripts
