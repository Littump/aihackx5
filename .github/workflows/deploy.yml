name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/littump/aihackx5-backend:${{ env.TAG }}
            ghcr.io/littump/aihackx5-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/littump/aihackx5-frontend:${{ env.TAG }}
            ghcr.io/littump/aihackx5-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Деплой на VM по SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$VM_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key $VM_USER@$VM_HOST"
          scp -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key \
            deploy/docker-compose.prod.yml deploy/nginx.conf deploy/.env.prod.example \
            "$VM_USER@$VM_HOST:/opt/domovoy/"
          # run --rm migrate && up -d — только up -d с depends_on не гарантирует, что старый backend переживёт падение миграции нового тега
          $SSH "cd /opt/domovoy && export TAG=$TAG && \
            docker compose -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.prod.yml run --rm migrate && \
            docker compose -f docker-compose.prod.yml up -d && \
            curl -f http://localhost/api/v1/health"
