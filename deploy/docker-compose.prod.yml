services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/littump/aihackx5-backend:${TAG}
    env_file: .env
    command: python scripts/migrate.py
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/littump/aihackx5-backend:${TAG}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/littump/aihackx5-frontend:${TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  pgdata:
