services:
  postgres:
    image: postgres:16-alpine
    container_name: domovoy-postgres
    environment:
      POSTGRES_USER: domovoy
      POSTGRES_PASSWORD: domovoy
      POSTGRES_DB: domovoy
    ports:
      - "5433:5432"
    volumes:
      - domovoy-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domovoy -d domovoy"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  domovoy-pg:
